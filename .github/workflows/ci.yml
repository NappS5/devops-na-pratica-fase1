name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: devops-task-api

jobs:
  test:
    name: Testes da aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

  audit:
    name: Auditoria de segurança das dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção (falha em HIGH/CRITICAL)
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Verificar formatação (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform (sem backend remoto)
        run: terraform init -backend=false

      - name: Validar configuração
        run: terraform validate

  docker:
    name: Build, scan e smoke test da imagem Docker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Trivy - relatório de vulnerabilidades HIGH e CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy - falhar em vulnerabilidades CRITICAL corrigíveis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test do container
        run: |
          set -euo pipefail
          docker run -d --name smoke-test -p 3000:3000 "${IMAGE_NAME}:ci"

          success=false
          for i in $(seq 1 15); do
            if curl -fs http://localhost:3000/health >/dev/null; then
              echo "Smoke test OK: /health respondeu com sucesso."
              success=true
              break
            fi
            sleep 2
          done

          if [ "$success" != "true" ]; then
            echo "Smoke test falhou: /health não respondeu a tempo." >&2
            docker logs smoke-test || true
            docker rm -f smoke-test >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f smoke-test >/dev/null 2>&1 || true

  cd:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: [test, audit, terraform, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Normalizar nome do repositório (minúsculas para o GHCR)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem para o GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
