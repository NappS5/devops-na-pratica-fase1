services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-task-api:local
    container_name: devops-task-api-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: devops-task-api-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
